<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bitrust-zen3 · Local 1.58-bit Chat</title>
<style>
  :root {
    --bg: #0c0e12;
    --panel: #141820;
    --panel-2: #1b212c;
    --border: #262e3d;
    --text: #e6ebf2;
    --muted: #8b96a8;
    --accent: #f97316;
    --accent-dim: rgba(249, 115, 22, 0.14);
    --green: #22c55e;
    --user-bg: #1e293b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
  }
  .app { display: flex; flex-direction: column; height: 100vh; max-width: 900px; margin: 0 auto; }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    background: var(--bg); flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -0.01em; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.err { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
  .badge {
    font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 999px;
    background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(249,115,22,.3);
  }
  .stats { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .stats b { color: var(--text); font-weight: 600; }
  .controls {
    display: flex; align-items: center; gap: 10px; padding: 8px 18px;
    border-bottom: 1px solid var(--border); background: var(--panel);
    font-size: 12px; color: var(--muted); flex-wrap: wrap;
  }
  .controls label { display: flex; align-items: center; gap: 6px; }
  .controls input[type="range"] { width: 76px; accent-color: var(--accent); }
  .controls select, .controls button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer;
  }
  .controls button:hover { border-color: var(--accent); }
  .spacer { flex: 1; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px 18px; display: flex; flex-direction: column; gap: 16px;
  }
  .empty {
    margin: auto; text-align: center; color: var(--muted); max-width: 440px;
  }
  .empty h2 { color: var(--text); margin: 0 0 6px; font-size: 18px; }
  .msg { display: flex; flex-direction: column; gap: 4px; max-width: 88%; }
  .msg.user { align-self: flex-end; }
  .msg.assistant { align-self: flex-start; width: 100%; max-width: 100%; }
  .role { font-size: 11px; font-family: var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .msg.user .role { text-align: right; }
  .bubble {
    padding: 11px 14px; border-radius: 10px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--user-bg); border: 1px solid #334155; }
  .msg.assistant .bubble { background: var(--panel); border: 1px solid var(--border); }
  .bubble pre {
    background: #090b0f; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; font-family: var(--mono); font-size: 13px; margin: 8px 0;
  }
  .bubble code { font-family: var(--mono); font-size: 13px; }
  .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
  footer {
    padding: 12px 18px 16px; border-top: 1px solid var(--border); background: var(--bg);
  }
  .composer {
    display: flex; gap: 8px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px;
  }
  .composer:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1; background: transparent; border: none; color: var(--text);
    font-family: var(--sans); font-size: 15px; resize: none; outline: none;
    min-height: 24px; max-height: 160px; line-height: 1.45; padding: 2px 4px;
  }
  .btn {
    background: var(--accent); color: #0c0e12; border: none; border-radius: 7px;
    padding: 8px 14px; font-weight: 650; font-size: 13px; cursor: pointer;
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.stop { background: #ef4444; color: #fff; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span id="dot" class="dot"></span>
      <span>bitrust</span>
      <span class="badge">zen3 · 1.58-bit</span>
    </div>
    <div class="stats">
      <span id="modelName">loading…</span>
      <span>speed: <b id="liveTps">--</b> tok/s</span>
      <span>spec: <b id="specPct">--</b></span>
    </div>
  </header>

  <div class="controls">
    <label>Temp <input id="temp" type="range" min="0" max="1" step="0.05" value="0"> <span id="tempVal">0.00</span></label>
    <label>Max tokens
      <select id="maxTok">
        <option value="128">128</option>
        <option value="256" selected>256</option>
        <option value="512">512</option>
        <option value="1024">1024</option>
      </select>
    </label>
    <span class="spacer"></span>
    <button id="clearBtn" type="button">Clear chat</button>
  </div>

  <main id="chat">
    <div class="empty">
      <h2>bitrust-zen3 local chat</h2>
      <p>BitNet-b1.58-2B-4T running on CPU with Q4_K tied embeddings + 4–6-gram speculative lookup.</p>
    </div>
  </main>

  <footer>
    <form id="form" class="composer">
      <textarea id="input" rows="1" placeholder="Message bitrust… (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="sendBtn" class="btn" type="submit">Send</button>
      <button id="stopBtn" class="btn stop" type="button" style="display:none">Stop</button>
    </form>
  </footer>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const formEl = document.getElementById('form');
const sendBtn = document.getElementById('sendBtn');
const stopBtn = document.getElementById('stopBtn');
const clearBtn = document.getElementById('clearBtn');
const tempEl = document.getElementById('temp');
const tempValEl = document.getElementById('tempVal');
const maxTokEl = document.getElementById('maxTok');
const modelNameEl = document.getElementById('modelName');
const liveTpsEl = document.getElementById('liveTps');
const specPctEl = document.getElementById('specPct');
const dotEl = document.getElementById('dot');

let messages = [];
let controller = null;

tempEl.addEventListener('input', () => {
  tempValEl.textContent = Number(tempEl.value).toFixed(2);
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    formEl.requestSubmit();
  }
});

clearBtn.addEventListener('click', () => {
  if (controller) controller.abort();
  messages = [];
  chatEl.innerHTML = '<div class="empty"><h2>bitrust-zen3 local chat</h2><p>Chat cleared.</p></div>';
});

stopBtn.addEventListener('click', () => {
  if (controller) controller.abort();
});

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderText(raw) {
  // Minimal safe fenced code block renderer
  const parts = raw.split(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g);
  let html = '';
  for (let i = 0; i < parts.length; i += 3) {
    html += escapeHtml(parts[i] || '').replace(/`([^`]+)`/g, '<code>$1</code>');
    if (i + 2 < parts.length) {
      html += '<pre><code>' + escapeHtml(parts[i + 2]) + '</code></pre>';
    }
  }
  return html;
}

function addMsg(role, text) {
  const empty = chatEl.querySelector('.empty');
  if (empty) empty.remove();
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const r = document.createElement('div');
  r.className = 'role';
  r.textContent = role;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = renderText(text);
  const m = document.createElement('div');
  m.className = 'meta';
  wrap.append(r, b, m);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return { bubble: b, meta: m };
}

async function pollHealth() {
  try {
    const res = await fetch('/health');
    const data = await res.json();
    dotEl.classList.remove('err');
    modelNameEl.textContent = data.model || 'bitnet';
    if (data.last_tok_per_sec > 0) liveTpsEl.textContent = data.last_tok_per_sec.toFixed(1);
    specPctEl.textContent = (data.last_spec_accept_pct || 0).toFixed(0) + '%';
  } catch {
    dotEl.classList.add('err');
  }
}

formEl.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text || controller) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  messages.push({ role: 'user', content: text });
  addMsg('user', text);

  const assistant = addMsg('assistant', '…');
  controller = new AbortController();
  sendBtn.style.display = 'none';
  stopBtn.style.display = 'inline-block';

  let acc = '';
  let chunks = 0;
  const t0 = performance.now();

  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: controller.signal,
      body: JSON.stringify({
        model: 'bitrust',
        messages,
        max_tokens: Number(maxTokEl.value),
        temperature: Number(tempEl.value),
        stream: true
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const payload = trimmed.slice(5).trim();
        if (payload === '[DONE]') continue;
        try {
          const j = JSON.parse(payload);
          const delta = j.choices?.[0]?.delta?.content;
          if (delta) {
            acc += delta;
            chunks++;
            assistant.bubble.innerHTML = renderText(acc);
            const dt = (performance.now() - t0) / 1000;
            if (dt > 0.05) {
              const tps = chunks / dt;
              liveTpsEl.textContent = tps.toFixed(1);
              assistant.meta.textContent = `${chunks} tok · ${tps.toFixed(1)} tok/s`;
            }
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        } catch {}
      }
    }
    if (acc) messages.push({ role: 'assistant', content: acc });
  } catch (err) {
    if (err.name === 'AbortError') {
      assistant.meta.textContent += ' · stopped';
      if (acc) messages.push({ role: 'assistant', content: acc });
    } else {
      assistant.bubble.textContent = 'Error: ' + err.message;
    }
  } finally {
    controller = null;
    sendBtn.style.display = 'inline-block';
    stopBtn.style.display = 'none';
    pollHealth();
    inputEl.focus();
  }
});

pollHealth();
</script>
</body>
</html>
