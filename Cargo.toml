[package]
name = "bitrust"
version = "0.1.0"
edition = "2021"
description = "bitrust-zen3: Zen 3 tuned Rust FFI inference harness for Microsoft BitNet 1.58-bit models"
license = "MIT"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
